# prod

server.ssl.bundle=rest-galleries-prod-server
spring.ssl.bundle.pem.rest-galleries-prod-server.keystore.certificate=file:/etc/letsencrypt/live/footeware.ca/fullchain.pem
spring.ssl.bundle.pem.rest-galleries-prod-server.keystore.private-key=file:/etc/letsencrypt/live/footeware.ca/privkey.pem
spring.ssl.bundle.pem.rest-galleries-prod-server.reload-on-update=true

images.path=/opt/rest.galleries/galleries